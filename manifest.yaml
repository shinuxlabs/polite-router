display_information:
  name: Polite Router
  description: Reads a site's rules and finds the lowest-impact way in.
  background_color: "#1a1a2e"

features:
  app_home:
    home_tab_enabled: true
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  agent_view:
    agent_description: Chat in Messages. Send a URL for a polite route, or just talk. Grok answers.
    suggested_prompts:
      - title: Route a site
        message: "https://example.com"
      - title: What can you do?
        message: What can you do?
  bot_user:
    display_name: PoliteRouter
    always_online: true
  slash_commands:
    - command: /route
      url: https://polite-router.vercel.app/api/slack
      description: Route a website politely
      usage_hint: "https://example.com"
      should_escape: false

oauth_config:
  scopes:
    bot:
      - chat:write
      - commands
      - im:history
      - im:read
      - im:write
      - app_mentions:read
      - assistant:write

settings:
  event_subscriptions:
    request_url: https://polite-router.vercel.app/api/slack
    bot_events:
      - app_home_opened
      - app_mention
      - message.im
      - agent_session_stopped
  interactivity:
    is_enabled: true
    request_url: https://polite-router.vercel.app/api/slack
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
