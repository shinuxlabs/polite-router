display_information:
  name: Polite Router
  description: Reads a site's rules and finds the lowest-impact way in.
  background_color: "#1a1a2e"

features:
  app_home:
    home_tab_enabled: true
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: PoliteRouter
    always_online: true
  slash_commands:
    - command: /route
      url: ""
      description: Route a website politely
      usage_hint: "https://example.com"
      should_escape: false

oauth_config:
  scopes:
    bot:
      - chat:write
      - commands
      - im:history
      - im:read
      - im:write
      - app_mentions:read

settings:
  event_subscriptions:
    bot_events:
      - app_home_opened
      - app_mention
      - message.im
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
